  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: #fff8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 28px;
      max-width: 420px;
      width: 100%;
      padding: 44px 36px 36px;
      box-shadow: 0 8px 40px rgba(255, 160, 90, 0.13);
      text-align: center;
      animation: popUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      border-radius: 28px 28px 0 0;
      background: linear-gradient(90deg, #ffb347, #ff8fab, #a8d8ea, #ffb347);
      background-size: 200%;
      animation: rainbow 3s linear infinite;
    }

    .icon-wrap {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: #fff3e8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      margin: 0 auto 20px;
      position: relative;
      animation: bounce 0.7s ease 0.3s both;
    }

    .sparkle {
      position: absolute;
      font-size: 20px;
      animation: sparkle 0.6s ease both;
    }

    .sparkle:nth-child(1) {
      top: -6px;
      right: 0px;
      animation-delay: 0.8s;
    }

    .sparkle:nth-child(2) {
      bottom: 2px;
      left: -4px;
      animation-delay: 1.0s;
    }

    .sparkle:nth-child(3) {
      top: 8px;
      left: -8px;
      animation-delay: 0.9s;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #2d2d2d;
      margin-bottom: 10px;
      animation: fadeUp 0.5s ease 0.5s both;
    }

    .subtitle {
      font-size: 0.93rem;
      color: #aaa;
      line-height: 1.7;
      margin-bottom: 32px;
      animation: fadeUp 0.5s ease 0.6s both;
    }

    .order-box {
      background: #fff8f0;
      border-radius: 16px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: fadeUp 0.5s ease 0.7s both;
    }

    .order-label {
      font-size: 0.72rem;
      color: #ccc;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }

    .order-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: #ff8c42;
      letter-spacing: 0.02em;
    }

    .order-badge {
      background: #e8f8ee;
      color: #3abf6e;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    @keyframes popUp {
      from {
        opacity: 0;
        transform: scale(0.88) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes bounce {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      70% {
        transform: scale(1.15);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes sparkle {
      0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
      }

      60% {
        opacity: 1;
        transform: scale(1.3) rotate(15deg);
      }

      100% {
        opacity: 1;
        transform: scale(1) rotate(10deg);
      }
    }

    @keyframes rainbow {
      0% {
        background-position: 0%;
      }

      100% {
        background-position: 200%;
      }
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="icon-wrap">
      🐶
      <span class="sparkle">⭐</span>
      <span class="sparkle">✨</span>
      <span class="sparkle">⭐</span>
    </div>

    <h1>Cảm ơn bạn! 🐾</h1>
    <p class="subtitle">
      Đơn hàng của bạn đã được đặt thành công.<br />
      Chúng mình sẽ giao hàng sớm nhất có thể nhé!
    </p>

    <div class="order-box">
      <div>
        <div class="order-label">Mã đơn hàng</div>
        <div class="order-num" id="orderCode"></div>
      </div>
      <div class="order-badge">✓ Đã xác nhận</div>
    </div>
  </div>

  <script>
    // Gen mã: TIPET-DDMMYYYYHHmm
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dd = pad(now.getDate());
    const mm = pad(now.getMonth() + 1);
    const yyyy = now.getFullYear();
    const hh = pad(now.getHours());
    const min = pad(now.getMinutes());

    document.getElementById('orderCode').textContent = `TIPET-${dd}${mm}${yyyy}${hh}${min}`;
  </script>

</body>

</html>
